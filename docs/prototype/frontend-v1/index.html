<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>讲给我听 · Web 前端原型 v1</title>
    <style>
      :root {
        --ink: #263238;
        --muted: #788187;
        --paper: #fffdf8;
        --cream: #f5f0e8;
        --line: #e5dacb;
        --coral: #de755f;
        --coral-dark: #b95647;
        --yellow: #e9bd57;
        --green: #679477;
        --blue: #7897aa;
        --shadow: 0 16px 40px rgba(76, 61, 44, .10);
        --radius: 20px;
      }

      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--cream); font-family: "Noto Serif SC", "Songti SC", serif; }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      .prototype-badge { position: fixed; z-index: 20; top: 14px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 7px 13px; border-radius: 999px; font: 11px/1.1 ui-sans-serif, system-ui; letter-spacing: .08em; box-shadow: 0 5px 18px rgba(0,0,0,.18); }
      .app { min-height: 100vh; padding-bottom: 96px; }
      .topbar { height: 78px; display: flex; align-items: center; justify-content: space-between; max-width: 1240px; margin: auto; padding: 0 34px; border-bottom: 1px solid var(--line); }
      .brand { display: flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
      .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; color: white; background: var(--coral); border-radius: 13px 13px 13px 4px; font-weight: 700; transform: rotate(-5deg); box-shadow: 3px 3px 0 #d8af86; }
      .brand strong, .brand small { display: block; }
      .brand strong { font-size: 18px; letter-spacing: .13em; }
      .brand small { margin-top: 3px; color: var(--muted); font: 10px ui-sans-serif, system-ui; letter-spacing: .12em; }
      .top-actions { display: flex; align-items: center; gap: 12px; color: var(--muted); font: 12px ui-sans-serif, system-ui; }
      .status-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--green); }
      .ghost-button { border: 1px solid var(--line); color: var(--ink); background: rgba(255,253,248,.62); border-radius: 10px; padding: 9px 13px; }
      .shell { max-width: 1240px; margin: auto; padding: 0 34px; }
      .hero { display: flex; justify-content: space-between; align-items: end; padding: 58px 6px 34px; }
      .eyebrow { color: var(--coral); font: 700 11px ui-sans-serif, system-ui; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 680px; margin: 12px 0 13px; font-size: clamp(34px, 5vw, 58px); line-height: 1.14; font-weight: 400; letter-spacing: .04em; }
      h1 em { color: var(--coral); font-style: normal; position: relative; }
      h1 em::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 5px; background: var(--yellow); border-radius: 50%; transform: rotate(-2deg); }
      .lede { max-width: 570px; margin: 0; color: #68747b; font-size: 14px; line-height: 1.9; }
      .hero-stamp { width: 135px; height: 135px; display: grid; place-items: center; color: var(--coral); border: 1px solid #e4cdb2; border-radius: 50%; transform: rotate(8deg); font-size: 18px; line-height: 1.5; text-align: center; }
      .state-label { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; color: var(--muted); font: 11px ui-sans-serif, system-ui; }
      .state-label strong { color: var(--coral); letter-spacing: .13em; }
      .workspace { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 20px; align-items: start; }
      .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
      .side-card { padding: 25px 22px; }
      .card-kicker { margin: 0 0 7px; color: var(--coral); font: 700 10px ui-sans-serif, system-ui; letter-spacing: .15em; }
      h2, h3 { margin: 0; font-weight: 700; }
      h2 { font-size: 20px; letter-spacing: .03em; }
      h3 { font-size: 19px; }
      .upload-zone { display: flex; min-height: 190px; margin: 25px 0 18px; align-items: center; justify-content: center; flex-direction: column; gap: 7px; border: 1.5px dashed #d7c3a8; border-radius: 15px; background: #fcf8f0; color: var(--ink); text-align: center; }
      .upload-zone:hover { border-color: var(--coral); background: #fff5ed; }
      .upload-zone input { display: none; }
      .upload-icon { color: var(--coral); font: 42px Arial; line-height: 1; }
      .upload-zone strong { font-size: 14px; }
      .upload-zone small { color: var(--muted); font: 10px/1.6 ui-sans-serif, system-ui; }
      .sample-button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border: 0; border-radius: 11px; background: #f4ecdf; color: var(--ink); text-align: left; }
      .sample-button:hover { background: #ede0cc; }
      .sample-thumb { display: grid; place-items: center; width: 38px; height: 44px; background: white; border: 1px solid var(--line); border-radius: 5px; color: var(--coral); }
      .sample-button strong, .sample-button small { display: block; }
      .sample-button strong { font-size: 11px; }
      .sample-button small { margin-top: 4px; color: var(--muted); font: 10px ui-sans-serif, system-ui; }
      .arrow { margin-left: auto; color: var(--coral); font-size: 22px; }
      .privacy { margin: 23px 0 0; color: #aaa096; font: 10px/1.7 ui-sans-serif, system-ui; }
      .main-card { min-height: 570px; padding: 28px 31px; }
      .main-heading { display: flex; justify-content: space-between; gap: 15px; align-items: start; }
      .pill { white-space: nowrap; padding: 7px 11px; border: 1px solid #c8dfd0; border-radius: 999px; color: var(--green); background: #f0f7f0; font: 11px ui-sans-serif, system-ui; }
      .question-paper { position: relative; margin-top: 21px; padding: 15px 42px 15px 17px; border-left: 3px solid var(--yellow); background: #fbf5e9; }
      .question-paper small { color: #ae9771; font: 10px ui-sans-serif, system-ui; }
      .question-paper p { margin: 6px 0 0; font-size: 14px; line-height: 1.9; }
      .edit-link { position: absolute; top: 12px; right: 12px; border: 0; background: none; color: var(--coral); font: 11px ui-sans-serif, system-ui; }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
      .chip { padding: 5px 9px; border-radius: 6px; background: #edf4ec; color: var(--green); font: 10px ui-sans-serif, system-ui; }
      .chip.muted { color: #918d87; background: #f1eee9; }
      .divider { display: flex; align-items: center; gap: 10px; margin: 24px 0 18px; color: #ae9f91; font: 10px ui-sans-serif, system-ui; }
      .divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
      .step-view { display: grid; grid-template-columns: 63px minmax(0, 1fr) 245px; gap: 18px; align-items: center; }
      .step-number { color: var(--coral); font: 24px Georgia, serif; }
      .step-number small { color: #b7aca1; font-size: 12px; }
      .step-copy p { margin: 9px 0 0; color: #69757b; font-size: 13px; line-height: 1.9; }
      .formula { margin-top: 13px; padding: 9px 12px; border-radius: 8px; background: #f8eedc; color: var(--coral-dark); font: 17px Georgia, serif; }
      .visual { min-height: 145px; padding: 22px 17px 14px; border-radius: 13px; background: #fff8eb; }
      .bar { display: flex; height: 30px; overflow: hidden; border-radius: 7px; background: #f2dfc0; }
      .bar span:first-child { width: 33.33%; background: var(--coral); }
      .bar span:last-child { flex: 1; background: var(--yellow); }
      .visual-caption { display: flex; justify-content: space-between; margin-top: 8px; color: #857667; font: 9px ui-sans-serif, system-ui; }
      .visual-note { margin-top: 20px; color: #a0907c; font: 10px ui-sans-serif, system-ui; text-align: center; }
      .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 27px; }
      .primary { border: 0; border-radius: 10px; padding: 11px 16px; background: var(--ink); color: white; font: 12px ui-sans-serif, system-ui; }
      .primary:hover { background: var(--coral-dark); }
      .secondary { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: #fffaf2; color: var(--ink); font: 12px ui-sans-serif, system-ui; }
      .secondary:hover { border-color: var(--coral); color: var(--coral-dark); }
      .pager { display: flex; align-items: center; gap: 12px; color: var(--coral); }
      .pager button { border: 0; background: none; color: var(--coral); font-size: 21px; }
      .dots { display: flex; gap: 4px; }
      .dots i { display: block; width: 7px; height: 7px; border-radius: 10px; background: #ded4c8; }
      .dots i.active { width: 20px; background: var(--coral); }
      .practice { display: flex; justify-content: space-between; align-items: center; gap: 30px; margin-top: 20px; padding: 24px 30px; }
      .practice p { margin: 8px 0 0; color: #68747b; font-size: 13px; line-height: 1.8; }
      .answer-row { display: flex; align-items: end; gap: 9px; }
      .answer-row label { display: block; margin-bottom: 7px; color: #958b81; font: 10px ui-sans-serif, system-ui; }
      .answer-input { width: 125px; padding: 6px 0; border: 0; border-bottom: 1px solid #cbb79b; outline: 0; background: transparent; font-size: 17px; }
      .feedback { min-height: 18px; margin: 8px 0 0; font: 11px ui-sans-serif, system-ui; }
      .success { color: var(--green); }
      .danger { color: var(--coral-dark); }
      .notice { margin: 17px 0 0; padding: 13px 15px; border-radius: 10px; background: #fff0e9; color: var(--coral-dark); font: 12px/1.7 ui-sans-serif, system-ui; }
      .processing { max-width: 590px; margin: 38px auto 0; }
      .processing h3 { font-size: 24px; }
      .processing p { color: var(--muted); font-size: 13px; line-height: 1.8; }
      .stage-list { margin: 28px 0; padding: 0; list-style: none; }
      .stage-list li { display: flex; align-items: center; gap: 13px; padding: 12px 0; border-bottom: 1px solid #eee5da; color: #aaa19a; font-size: 14px; }
      .stage-list li.done { color: var(--green); }
      .stage-list li.current { color: var(--ink); font-weight: 700; }
      .stage-icon { display: grid; place-items: center; width: 23px; height: 23px; border: 1px solid currentColor; border-radius: 50%; font: 12px ui-sans-serif, system-ui; }
      .processing-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .confirm-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; margin-top: 29px; }
      .photo-placeholder { display: grid; place-items: center; min-height: 245px; border: 1px solid var(--line); border-radius: 12px; background: #f1e8da; color: #a89886; font-size: 42px; }
      .confirm-copy textarea { width: 100%; min-height: 160px; padding: 13px; resize: vertical; border: 1px solid #ddcfbd; border-radius: 11px; outline: 0; background: #fffcf5; color: var(--ink); font-size: 14px; line-height: 1.9; }
      .confirm-copy textarea:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(222,117,95,.12); }
      .confirm-hint { margin: 9px 0 18px; color: #977d64; font: 11px/1.7 ui-sans-serif, system-ui; }
      .decision-row { display: flex; gap: 10px; flex-wrap: wrap; }
      .empty-center { max-width: 570px; margin: 26px auto 0; text-align: center; }
      .empty-center .upload-zone { min-height: 205px; }
      .empty-center .sample-button { max-width: 350px; margin: auto; }
      .variant-bar { position: fixed; z-index: 30; left: 50%; bottom: 18px; display: flex; align-items: center; gap: 14px; transform: translateX(-50%); padding: 9px 12px; border: 1px solid #51483f; border-radius: 999px; background: #28231f; color: white; box-shadow: 0 10px 30px rgba(0,0,0,.25); font: 12px ui-sans-serif, system-ui; }
      .variant-bar button { display: grid; place-items: center; width: 25px; height: 25px; border: 0; border-radius: 50%; background: #51483f; color: white; }
      .variant-bar button:hover { background: var(--coral); }
      .variant-name { min-width: 170px; text-align: center; }
      .logic-bar { position: fixed; z-index: 29; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 7px; padding: 8px 10px; border: 1px solid #d7c9b8; border-radius: 12px; background: rgba(255,253,248,.95); box-shadow: 0 8px 24px rgba(76,61,44,.14); font: 10px ui-sans-serif, system-ui; }
      .logic-bar span { color: var(--muted); }
      .logic-bar button { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: #fff; color: var(--ink); font-size: 10px; }
      .logic-bar button:hover { border-color: var(--coral); color: var(--coral-dark); }
      .variant-b, .variant-c { display: none; }
      .variant-b .workspace { grid-template-columns: 1fr; }
      .variant-b .side-card { display: none; }
      .variant-b .main-card { min-height: 520px; }
      .variant-b .main-heading { align-items: center; }
      .track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 28px 0 35px; }
      .track-item { position: relative; padding-top: 29px; color: #aca39c; font: 10px ui-sans-serif, system-ui; text-align: center; }
      .track-item::before { content: ""; position: absolute; top: 0; left: 50%; width: 17px; height: 17px; border: 2px solid #d8cec2; border-radius: 50%; background: var(--paper); transform: translateX(-50%); }
      .track-item::after { content: ""; position: absolute; top: 8px; left: calc(50% + 10px); right: calc(-50% + 10px); height: 2px; background: #e8ded2; }
      .track-item:last-child::after { display: none; }
      .track-item.done, .track-item.current { color: var(--coral-dark); }
      .track-item.done::before { border-color: var(--green); background: var(--green); box-shadow: inset 0 0 0 4px var(--paper); }
      .track-item.current::before { border-color: var(--coral); box-shadow: 0 0 0 5px #f7ddd5; }
      .variant-b .confirm-layout { max-width: 780px; margin: auto; }
      .variant-b .step-view { grid-template-columns: 75px 1fr; max-width: 820px; margin: auto; }
      .variant-b .visual { grid-column: 2; }
      .variant-b .practice { max-width: 820px; margin: 20px auto 0; }
      .variant-c .workspace { display: block; }
      .variant-c .side-card { display: none; }
      .variant-c .main-card { max-width: 850px; margin: auto; min-height: 610px; padding: 38px 55px; }
      .variant-c .question-paper { max-width: 650px; margin: 30px auto 0; }
      .variant-c .chips, .variant-c .divider { max-width: 650px; margin-left: auto; margin-right: auto; }
      .variant-c .step-view { max-width: 650px; display: block; margin: 0 auto; }
      .variant-c .step-number { margin-bottom: 15px; }
      .variant-c .visual { margin-top: 22px; }
      .variant-c .controls { max-width: 650px; margin-left: auto; margin-right: auto; }
      .variant-c .practice { max-width: 850px; margin: 20px auto; }
      @media (max-width: 850px) {
        .topbar, .shell { padding-left: 18px; padding-right: 18px; }
        .topbar { height: 68px; }
        .top-actions > span { display: none; }
        .hero { padding: 38px 3px 25px; }
        .hero-stamp { display: none; }
        .workspace { display: block; }
        .side-card { margin-bottom: 16px; }
        .main-card { padding: 23px 18px; }
        .step-view { grid-template-columns: 45px 1fr; }
        .step-view .visual { grid-column: 2; }
        .practice { display: block; padding: 22px 18px; }
        .answer-row { margin-top: 30px; }
        .confirm-layout { grid-template-columns: 1fr; }
        .photo-placeholder { min-height: 130px; }
        .logic-bar { right: 10px; bottom: 66px; }
        .variant-bar { bottom: 13px; }
        .variant-name { min-width: 125px; }
        .variant-c .main-card { padding: 25px 18px; }
      }
    </style>
  </head>
  <body>
    <div class="prototype-badge">PROTOTYPE · 仅用于验证逻辑</div>
    <div id="app"></div>

    <script>
      const QUESTION = '小明看一本 120 页的书，第一天看了全书的 1/3，第二天看了剩下的 1/4。第二天看了多少页？'
      const STEPS = [
        { title: '先找出“剩下的页数”', text: '第一天看了全书的 1/3，所以还剩下全书的 2/3。我们先不急着算第二天，先把“剩下的”找出来。', formula: '1 - 1/3 = 2/3', note: '把整本书看成 3 份' },
        { title: '再算剩下部分的 1/4', text: '第二天看的是剩下部分的 1/4，所以要用剩下的 80 页去乘 1/4。', formula: '120 × 2/3 × 1/4 = 20', note: '先求整体，再求其中的一部分' },
        { title: '最后检查答案', text: '20 页小于剩下的 80 页，放回题目中检查，数量和单位都符合题意。', formula: '答：第二天看了 20 页。', note: '答案要有数字，也要有单位' },
      ]
      const STAGES = [
        ['recognizing', '正在读题目'],
        ['confirmation', '确认题目'],
        ['structuring', '整理关系'],
        ['solving', '检查算式'],
        ['planning', '准备讲法'],
        ['ready', '可以开始讲'],
      ]

      const state = { status: 'empty', step: 0, variant: new URLSearchParams(location.search).get('variant') || 'A', answer: '', feedback: '', inputText: QUESTION }
      const variants = { A: 'A · 家庭讲解桌', B: 'B · 任务轨道', C: 'C · 讲义翻页' }

      function esc(value) { return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])) }
      function selectedClass(name) { return state.variant === name ? `variant-${name.toLowerCase()}` : '' }
      function shell(content, variantClass = '') {
        return `<div class="app ${variantClass}"><header class="topbar"><a class="brand" href="?variant=${state.variant}"><span class="brand-mark">算</span><span><strong>讲给我听</strong><small>小学数学家庭辅导</small></span></a><div class="top-actions"><span><i class="status-dot"></i>${state.status === 'ready' ? '讲解已准备好' : '陪你把“不会教”变成“会讲了”'}</span><button class="ghost-button" onclick="resetLesson()">新建题目</button></div></header><main class="shell">${content}</main>${variantSwitcher()}${logicControls()}</div>`
      }
      function hero() {
        return `<section class="hero"><div><div class="eyebrow">家庭辅导 · Lesson 工作台</div><h1>一道题，<em>慢慢讲</em><br>孩子就会了。</h1><p class="lede">先把题目读懂，再用孩子听得懂的方式，一步一步讲清楚。</p></div><div class="hero-stamp">每一步<br>都值得<br>讲明白</div></section>`
      }
      function sidebar() {
        return `<aside class="card side-card"><p class="card-kicker">STEP 01</p><h2>把题目交给我</h2><label class="upload-zone" for="image-input"><input id="image-input" type="file" accept="image/png,image/jpeg" onchange="fakeUpload(event)"><span class="upload-icon">＋</span><strong>上传题目照片</strong><small>支持 JPG、PNG，尽量拍清楚题干和图形</small></label><button class="sample-button" onclick="startSample()"><span class="sample-thumb">题</span><span><strong>先试试示例题</strong><small>五年级 · 分数应用题</small></span><span class="arrow">→</span></button><p class="privacy">▣ 图片只用于本次讲解，不会公开展示</p></aside>`
      }
      function stageTrack() {
        const activeIndex = state.status === 'empty' ? -1 : state.status === 'failed' ? 0 : STAGES.findIndex(([key]) => key === state.status)
        return `<div class="track">${STAGES.map(([key, label], index) => `<div class="track-item ${index < activeIndex ? 'done' : ''} ${index === activeIndex ? 'current' : ''}">${label}</div>`).join('')}</div>`
      }
      function questionPaper() {
        return `<div class="question-paper"><small>题目 ${state.status === 'confirmation' ? '· 请确认文字' : '· 已确认'}</small><p>${esc(state.inputText)}</p>${state.status === 'ready' ? '' : '<button class="edit-link" onclick="goConfirm()">修改文字</button>'}</div><div class="chips"><span class="chip">分数应用题</span><span class="chip muted">五年级 · 分数乘法</span></div>`
      }
      function visual(step) {
        return `<div class="visual"><div class="bar"><span></span><span></span></div><div class="visual-caption"><span>第一天：1/3</span><span>剩下：2/3</span></div><div class="visual-note">${step.note}</div></div>`
      }
      function lessonView() {
        const step = STEPS[state.step]
        return `<div class="state-label"><strong>STEP 02 · 讲解中</strong><span>识别清楚度 98%</span></div>${questionPaper()}<div class="divider"><span>今天我们只解决一个小问题</span></div><div class="step-view"><div class="step-number">0${state.step + 1}<small> / 03</small></div><div class="step-copy"><h3>${step.title}</h3><p>${step.text}</p><div class="formula">${step.formula}</div></div>${visual(step)}</div><div class="controls"><button class="secondary" onclick="speakStep()">◖ 听我讲</button><div class="pager"><button onclick="previousStep()">←</button><span class="dots">${STEPS.map((_, i) => `<i class="${i === state.step ? 'active' : ''}"></i>`).join('')}</span><button onclick="nextStep()">→</button></div></div>`
      }
      function practice() {
        return `<section class="card practice"><div><p class="card-kicker">STEP 03 · 巩固一下</p><h2>换一道相似的，你来试试</h2><p>一盒彩笔有 48 支，送给弟弟全盒的 1/4，送了多少支？</p></div><div><div class="answer-row"><div><label for="answer">我的答案</label><input id="answer" class="answer-input" inputmode="numeric" value="${esc(state.answer)}" oninput="state.answer=this.value"><span> 支</span></div><button class="primary" onclick="checkAnswer()">检查一下</button></div><p class="feedback ${state.feedback.startsWith('太好了') ? 'success' : 'danger'}">${esc(state.feedback)}</p></div></section>`
      }
      function confirmationView() {
        return `<div class="state-label"><strong>STEP 01 · 需要你看一眼</strong><span>有些内容我不太确定</span></div><div class="confirm-layout"><div class="photo-placeholder">题<br>目<br>图</div><div class="confirm-copy"><h2>请帮我确认一下题目</h2><p class="confirm-hint">请重点检查数字、分数、单位和问题目标。你修改后的文字会直接用于后面的讲解，不需要重新识别。</p><textarea oninput="state.inputText=this.value">${esc(state.inputText)}</textarea><div class="decision-row"><button class="secondary" onclick="resetLesson()">重新上传</button><button class="primary" onclick="confirmQuestion()">确认，继续讲解</button></div></div></div>`
      }
      function processingView() {
        const map = { recognizing: ['正在读题目', '正在检查题目文字、数字和单位'], structuring: ['正在整理题目', '正在找出已知条件和问题目标'], solving: ['正在检查算式', '正在验证计算过程和答案'], planning: ['正在准备讲法', '正在把解法改成孩子听得懂的话'] }
        const current = map[state.status] || map.recognizing
        const index = STAGES.findIndex(([key]) => key === state.status)
        return `<div class="processing"><p class="card-kicker">任务处理中</p><h3>${current[0]}</h3><p>${current[1]}</p><ul class="stage-list">${STAGES.slice(0, 5).map(([key, label], i) => `<li class="${i < index ? 'done' : i === index ? 'current' : ''}"><span class="stage-icon">${i < index ? '✓' : i === index ? '·' : '○'}</span>${label}</li>`).join('')}</ul><div class="processing-actions"><button class="primary" onclick="advanceProcessing()">模拟下一阶段</button><button class="secondary" onclick="state.status='failed'; render()">模拟失败</button></div></div>`
      }
      function failedView() {
        return `<div class="processing"><p class="card-kicker">这次没有完成</p><h3>我没能把这道题整理好</h3><p>可能是照片中的数字或题目文字不够清楚。你可以再试一次，也可以换一张更清楚的照片。</p><div class="notice">错误类型：题目识别未完成<br>建议：让题干、数字和单位完整出现在照片中。</div><div class="processing-actions" style="margin-top:22px"><button class="primary" onclick="retryLesson()">再试一次</button><button class="secondary" onclick="resetLesson()">重新上传</button></div></div>`
      }
      function mainContent() {
        if (state.status === 'empty') return `<div class="empty-center"><p class="card-kicker">STEP 01 · 开始一道题</p><h2>先把题目放到桌上</h2><p class="lede" style="margin:12px auto 0">拍下作业，先看懂题目，再用孩子听得懂的方式，一步一步讲清楚。</p><label class="upload-zone" for="image-input"><input id="image-input" type="file" accept="image/png,image/jpeg" onchange="fakeUpload(event)"><span class="upload-icon">＋</span><strong>上传题目照片</strong><small>支持 JPG、PNG，尽量拍清楚题干和图形</small></label><button class="sample-button" onclick="startSample()"><span class="sample-thumb">题</span><span><strong>五年级 · 分数应用题</strong><small>小明看一本 120 页的书……</small></span><span class="arrow">→</span></button></div>`
        if (state.status === 'confirmation') return confirmationView()
        if (state.status === 'failed') return failedView()
        if (state.status !== 'ready') return processingView()
        return lessonView()
      }
      function renderA() { const body = state.status === 'ready' ? `<div class="workspace">${sidebar()}<div><section class="card main-card">${lessonView()}</section>${practice()}</div></div>` : `<div class="workspace">${sidebar()}<section class="card main-card">${mainContent()}</section></div>`; return shell(hero() + body, 'variant-a') }
      function renderB() { const body = `<section class="card main-card"><div class="state-label"><strong>当前任务</strong><span>${state.status === 'empty' ? '还没有开始' : state.status}</span></div>${stageTrack()}${mainContent()}</section>${state.status === 'ready' ? practice() : ''}`; return shell(hero() + `<div class="workspace">${body}</div>`, 'variant-b') }
      function renderC() { const body = `<section class="card main-card"><div class="main-heading"><div><p class="card-kicker">${state.status === 'ready' ? '正在讲解' : '讲解准备桌'}</p><h2>${state.status === 'ready' ? '跟着这一页，慢慢讲' : '先确认，再开始讲'}</h2></div><span class="pill">原型状态：${state.status}</span></div>${state.status === 'ready' ? lessonView() : mainContent()}</section>${state.status === 'ready' ? practice() : ''}`; return shell(hero() + body, 'variant-c') }
      function variantSwitcher() { return `<div class="variant-bar"><button onclick="changeVariant(-1)">←</button><span class="variant-name">${variants[state.variant]}</span><button onclick="changeVariant(1)">→</button></div>` }
      function logicControls() { return `<div class="logic-bar"><span>逻辑控制</span><button onclick="startSample()">开始示例</button><button onclick="state.status='confirmation'; render()">待确认</button><button onclick="state.status='ready'; render()">看讲解</button><button onclick="state.status='failed'; render()">失败</button></div>` }
      function render() { document.getElementById('app').innerHTML = state.variant === 'B' ? renderB() : state.variant === 'C' ? renderC() : renderA() }
      function changeVariant(direction) { const keys = ['A', 'B', 'C']; const next = (keys.indexOf(state.variant) + direction + keys.length) % keys.length; state.variant = keys[next]; const url = new URL(location.href); url.searchParams.set('variant', state.variant); history.replaceState({}, '', url); render() }
      function resetLesson() { state.status = 'empty'; state.step = 0; state.answer = ''; state.feedback = ''; state.inputText = QUESTION; render() }
      function startSample() { state.status = 'recognizing'; state.step = 0; state.feedback = ''; render() }
      function fakeUpload(event) { if (event.target.files && event.target.files[0]) { state.status = 'recognizing'; render() } }
      function advanceProcessing() { const sequence = ['recognizing', 'structuring', 'solving', 'planning', 'ready']; const i = sequence.indexOf(state.status); state.status = sequence[Math.min(i + 1, sequence.length - 1)]; render() }
      function retryLesson() { state.status = 'recognizing'; render() }
      function goConfirm() { state.status = 'confirmation'; render() }
      function confirmQuestion() { state.status = 'structuring'; render() }
      function previousStep() { state.step = Math.max(0, state.step - 1); render() }
      function nextStep() { state.step = Math.min(STEPS.length - 1, state.step + 1); render() }
      function checkAnswer() { state.feedback = state.answer.trim() === '12' ? '太好了，你找对了这一步。' : state.answer.trim() ? '再想一想：先算 48 的 1/4 是多少？' : '先写下你的答案，再检查一下。'; render() }
      function speakStep() { const text = STEPS[state.step].text; if ('speechSynthesis' in window) { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)) } else { alert('当前浏览器不支持朗读，但可以直接照着文字讲。') } }
      window.addEventListener('keydown', (event) => { if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return; if (event.key === 'ArrowLeft') changeVariant(-1); if (event.key === 'ArrowRight') changeVariant(1) })
      render()
    </script>
  </body>
</html>
